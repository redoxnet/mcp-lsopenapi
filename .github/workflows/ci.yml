name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore mcp-lsopenapi.slnx

      - name: Build
        run: dotnet build mcp-lsopenapi.slnx --no-restore -c Release

      - name: Test
        run: dotnet test mcp-lsopenapi.slnx --no-build -c Release --logger "console;verbosity=normal"
