<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Plotly Chart</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      --fg: #1a1a1a;
      --fg-muted: #6b6b6b;
      --bg: #ffffff;
      --bg-soft: #f5f5f7;
      --border: #e2e2e6;
      --badge-bg: #eef2ff;
      --badge-fg: #3730a3;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e8e8e8;
        --fg-muted: #9a9a9a;
        --bg: #1a1a1a;
        --bg-soft: #232326;
        --border: #2e2e33;
        --badge-bg: #1e1b4b;
        --badge-fg: #c7d2fe;
      }
    }
    /* Authoritative override when JS resolves a theme (hostContext.theme or
       spec _themeHint). Iframe `prefers-color-scheme` is unreliable across
       hosts — body.theme-dark / body.theme-light forces the right palette
       regardless. See docs/MCP-APPS-INTEROP.md §3 Q8. */
    body.theme-light {
      --fg: #1a1a1a; --fg-muted: #6b6b6b; --bg: #ffffff;
      --bg-soft: #f5f5f7; --border: #e2e2e6;
      --badge-bg: #eef2ff; --badge-fg: #3730a3;
    }
    body.theme-dark {
      --fg: #e8e8e8; --fg-muted: #9a9a9a; --bg: #1a1a1a;
      --bg-soft: #232326; --border: #2e2e33;
      --badge-bg: #1e1b4b; --badge-fg: #c7d2fe;
    }
    /* Body background stays transparent so the host card shows through
       — this is the actual fix for "white chart card on dark host". */
    html, body { margin: 0; padding: 0; background: transparent; color: var(--fg); }
    body {
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
            "Malgun Gothic", "맑은 고딕", "Noto Sans KR", system-ui, sans-serif;
      container-type: inline-size;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px 12px;
    }
    /* Default chart height tuned for chat panels in iframe-capable hosts
       (Cowork, VS Code Chat, basic-host). A candlestick chart with a
       volume subplot and MA overlays needs ~500px+ to be readable;
       360px (the pre-2026-05-27 default) felt cramped in Cowork chats.
       Hosts that auto-fit iframe to content (per SEP-1865 body-size
       notifications) will grow to this. Hosts with fixed iframe height
       will scroll. */
    .chart { order: 1; width: 100%; min-height: 520px; }
    .panel { order: 2; }
    /* Narrow widths (Claude side panel, tablets): list becomes primary,
       chart shrinks but keeps a readable floor. */
    @container (max-width: 600px) {
      .chart { order: 2; min-height: 360px; }
      .panel { order: 1; }
    }
    .panel-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 6px;
    }
    .panel-title { font-weight: 600; font-size: 14px; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      background: var(--badge-bg);
      color: var(--badge-fg);
      font-size: 11px;
      font-weight: 600;
    }
    table.holdings {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    table.holdings th, table.holdings td {
      padding: 4px 6px;
      border-bottom: 1px solid var(--border);
      text-align: right;
    }
    table.holdings th:first-child, table.holdings td:first-child { text-align: left; }
    table.holdings th { color: var(--fg-muted); font-weight: 500; }
    .notes { margin-top: 6px; color: var(--fg-muted); font-size: 12px; }
    .notes li { margin: 2px 0; }
    .empty { padding: 20px; text-align: center; color: var(--fg-muted); }
    .error { padding: 12px; color: #c0392b; font-size: 12px; }
  </style>
</head>
<body>
  <div class="container">
    <div id="chart" class="chart"></div>
    <div id="panel" class="panel" hidden></div>
  </div>
  <script>
    // ============================================================
    // SEP-1865 MCP Apps view: minimal JSON-RPC over postMessage.
    //
    // Lifecycle:
    //   1. Send `ui/initialize` request, receive McpUiInitializeResult.
    //   2. Send `ui/notifications/initialized` notification.
    //   3. Listen for `ui/notifications/tool-result` and render.
    //   4. Listen for `ui/notifications/host-context-changed` and re-apply.
    // ============================================================

    const INIT_REQUEST_ID = 1;
    const PROTOCOL_VERSION = "2026-01-26";
    // Below this width we drop in-cell labels for treemaps — Korean labels
    // become illegible noise at small sizes.
    const NARROW_PX = 420;

    let hostContext = {};
    let lastResult = null;

    function send(msg) {
      // Send the literal object. SEP-1865 PostMessageTransport on the host
      // side parses event.data with JSONRPCMessageSchema.safeParse directly;
      // a JSON string fails that parse and is silently dropped as non-JSON-RPC
      // noise (event.data?.jsonrpc is undefined on a string), causing the
      // host to hang at "Waiting for MCP App to initialize...". See
      // docs/MCP-APPS-INTEROP.md §3 Q1 for the discovery history.
      try { window.parent.postMessage(msg, "*"); }
      catch (_) { /* iframe not parented yet; ignored */ }
    }

    function notify(method, params) {
      send({ jsonrpc: "2.0", method, params: params || {} });
    }

    // SEP-1865 auto-resize. Without this, hosts (Cowork at minimum, probably
    // others) keep the iframe at their default size and ignore our CSS
    // min-height — so a 520px-min-height chart still appears in a 200-300px
    // frame. The reference App.setupSizeChangedNotifications (ext-apps
    // src/app.ts:1859) uses a ResizeObserver + requestAnimationFrame debounce
    // and the `max-content` height-measurement trick to send accurate
    // dimensions; we port the same pattern here. Observed 2026-05-27 in
    // Cowork: bumping CSS min-height alone didn't grow the iframe — sending
    // ui/notifications/size-changed is the actual lever.
    let _sizeScheduled = false;
    let _lastWidth = 0;
    let _lastHeight = 0;
    let _plotlyResizeScheduled = false;
    function sendBodySizeChanged() {
      if (_sizeScheduled) return;
      _sizeScheduled = true;
      requestAnimationFrame(() => {
        _sizeScheduled = false;
        const html = document.documentElement;
        // max-content trick: measure content's natural height instead of being
        // clamped to the current iframe height. fit-content would clamp;
        // setting html.style.width destroys horizontal scroll positions, so
        // width uses window.innerWidth verbatim.
        const originalHeight = html.style.height;
        html.style.height = "max-content";
        const height = Math.ceil(html.getBoundingClientRect().height);
        html.style.height = originalHeight;
        const width = Math.ceil(window.innerWidth);
        if (width !== _lastWidth || height !== _lastHeight) {
          _lastWidth = width;
          _lastHeight = height;
          notify("ui/notifications/size-changed", { width, height });
        }
      });
    }
    function setupAutoResize() {
      sendBodySizeChanged();
      const ro = new ResizeObserver(sendBodySizeChanged);
      ro.observe(document.documentElement);
      ro.observe(document.body);
      return () => ro.disconnect();
    }

    function schedulePlotlyResize() {
      const chart = document.getElementById("chart");
      if (!window.Plotly || !chart || !chart._fullLayout) return;
      if (_plotlyResizeScheduled) return;
      _plotlyResizeScheduled = true;
      requestAnimationFrame(() => {
        _plotlyResizeScheduled = false;
        if (!window.Plotly || !chart._fullLayout) return;
        Promise.resolve(Plotly.Plots.resize(chart))
          .then(sendBodySizeChanged)
          .catch(() => { /* best-effort sync only */ });
      });
    }

    function setupPlotlyResizeSync() {
      const chart = document.getElementById("chart");
      if (!chart || !window.ResizeObserver) return null;
      const ro = new ResizeObserver(schedulePlotlyResize);
      ro.observe(chart);
      return () => ro.disconnect();
    }

    function isVeryNarrow() {
      const w = hostContext.containerDimensions?.width
            ?? hostContext.containerDimensions?.maxWidth
            ?? window.innerWidth;
      return hostContext.platform === "mobile" || (w && w < NARROW_PX);
    }

    // Resolve theme from (1) tool spec override (`spec.layout.template?.layout.colorway`
    // is *not* the signal — we use a dedicated `_themeHint` field set by the
    // builder when the tool param overrides), (2) host signal hostContext.theme,
    // (3) iframe `prefers-color-scheme`. The chart layout *backgrounds* default
    // to transparent (set by builders), so the host card's bg shows through —
    // theme detection only drives axis/grid/font colors for readability.
    //
    // Track A diagnostic: the `[theme]` console.log surfaces which signal won
    // and what the iframe's media query saw. When inspecting a host in dev
    // tools, this single line answers "did the host send hostContext.theme,
    // and does the iframe's prefers-color-scheme actually follow the parent?"
    // — the two questions that drove the v1.5.1 investigation.
    // See docs/MCP-APPS-INTEROP.md §3 Q8 for the per-host empirical record.
    function resolveDark(spec) {
      const hint = spec?.layout?._themeHint;
      if (hint === "dark") return true;
      if (hint === "light") return false;
      if (hostContext.theme === "dark") return true;
      if (hostContext.theme === "light") return false;
      return window.matchMedia("(prefers-color-scheme: dark)").matches;
    }

    function applyTheme(layout, spec) {
      const dark = resolveDark(spec);
      const fg = dark ? "#e8e8e8" : "#1a1a1a";
      const grid = dark ? "#2e2e33" : "#e2e2e6";
      // Force CSS vars (panel/table/badge) to follow the resolved theme even
      // when the iframe's prefers-color-scheme disagrees with the host.
      document.body.classList.toggle("theme-dark", dark);
      document.body.classList.toggle("theme-light", !dark);
      try {
        console.log(
          "[theme] resolved=", dark ? "dark" : "light",
          "hostContext.theme=", hostContext.theme,
          "matchMedia dark=", window.matchMedia("(prefers-color-scheme: dark)").matches,
          "spec hint=", layout?._themeHint ?? "(none)");
      } catch (_) { /* no console — ignore */ }
      return Object.assign({
        // Transparent by default — host card background shows through on
        // hosts that don't propagate theme. Individual builders may set
        // explicit bg colors (e.g. a printable export) and those win via the
        // Object.assign(layout) below.
        paper_bgcolor: "rgba(0,0,0,0)",
        plot_bgcolor: "rgba(0,0,0,0)",
        font: { color: fg, family: "inherit" },
        xaxis: Object.assign({ gridcolor: grid, zerolinecolor: grid }, layout?.xaxis || {}),
        yaxis: Object.assign({ gridcolor: grid, zerolinecolor: grid }, layout?.yaxis || {}),
        margin: { t: 24, r: 16, b: 32, l: 56 },
      }, layout || {});
    }

    function renderChart() {
      const sc = lastResult?.structuredContent;
      const spec = sc?.chart?.spec;
      if (!spec) {
        document.getElementById("chart").innerHTML =
          '<div class="empty">차트 데이터가 없습니다.</div>';
        return;
      }
      const narrow = isVeryNarrow();
      // Suppress in-cell labels on very narrow widths — list panel takes over.
      const data = (spec.data || []).map(trace => {
        if (trace.type === "treemap" && narrow) {
          return Object.assign({}, trace, { textinfo: "none" });
        }
        return trace;
      });
      const layout = applyTheme(spec.layout, spec);
      Plotly.newPlot("chart", data, layout, {
        responsive: true,
        displayModeBar: false,
        displaylogo: false,
      }).then(() => {
        // Host iframes can settle to their final dimensions after the plot is
        // created. Force Plotly's internal geometry to match the rendered div
        // so hover hit-testing and spike lines stay under the actual cursor.
        schedulePlotlyResize();
      });
    }

    function renderEtfPanel(el, panel) {
      const rows = (panel.top_holdings || []).map((h, i) => `
        <tr>
          <td>${i + 1}. ${escapeHtml(h.name || h.shcode || "")}</td>
          <td>${(h.weight_pct ?? 0).toFixed(2)}%</td>
          <td>${(h.cumulative_pct ?? 0).toFixed(1)}%</td>
        </tr>`).join("");
      const notes = (panel.notes || []).map(n => `<li>${escapeHtml(n)}</li>`).join("");
      el.innerHTML = `
        <div class="panel-header">
          <div class="panel-title">${escapeHtml(panel.title || "구성종목")}</div>
          ${panel.concentration?.badge
            ? `<span class="badge">${escapeHtml(panel.concentration.badge)}</span>`
            : ""}
        </div>
        <table class="holdings">
          <thead><tr><th>종목</th><th>비중</th><th>누적</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        ${notes ? `<ul class="notes">${notes}</ul>` : ""}
      `;
    }

    function renderPanel() {
      const el = document.getElementById("panel");
      const panel = lastResult?.structuredContent?.panel;
      if (panel && panel.kind === "etf_holdings") {
        renderEtfPanel(el, panel);
        el.hidden = false;
      } else {
        el.hidden = true;
        el.innerHTML = "";
      }
    }

    function render() {
      if (!lastResult) return;
      if (!window.Plotly) {
        // Plotly CDN may still be loading; retry after a tick.
        setTimeout(render, 50);
        return;
      }
      renderChart();
      renderPanel();
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[c]);
    }

    window.addEventListener("message", (e) => {
      let msg;
      try { msg = typeof e.data === "string" ? JSON.parse(e.data) : e.data; }
      catch (_) { return; }
      if (!msg || typeof msg !== "object") return;

      // Initialize response.
      if (msg.id === INIT_REQUEST_ID && msg.result) {
        hostContext = msg.result.hostContext || {};
        notify("ui/notifications/initialized");
        setupAutoResize();
        setupPlotlyResizeSync();
        render();
        return;
      }

      // Notifications.
      switch (msg.method) {
        case "ui/notifications/tool-result":
          lastResult = msg.params || null;
          render();
          break;
        case "ui/notifications/host-context-changed":
          hostContext = Object.assign({}, hostContext, msg.params || {});
          render();
          break;
        case "ui/notifications/tool-input":
          // Not used in this template; arguments are reflected in the chart spec already.
          break;
      }
    });

    // Window resize fallback when host doesn't send containerDimensions updates.
    window.addEventListener("resize", () => { if (lastResult) render(); });

    // Kick off handshake. SEP-1865 McpUiInitializeRequest.params requires
    // THREE fields per the zod schema in @modelcontextprotocol/ext-apps —
    // protocolVersion, appCapabilities, and appInfo. Omitting appInfo causes
    // the host to silently drop the message at validation (same "Waiting for
    // MCP App to initialize..." hang as Q1). See docs/MCP-APPS-INTEROP.md
    // §3 Q2 for the discovery history.
    send({
      jsonrpc: "2.0",
      id: INIT_REQUEST_ID,
      method: "ui/initialize",
      params: {
        protocolVersion: PROTOCOL_VERSION,
        appCapabilities: {
          availableDisplayModes: ["inline"],
        },
        appInfo: {
          name: "mcp-lsopenapi/plotly",
          version: "1.0.0",
        },
      },
    });
  </script>
</body>
</html>
